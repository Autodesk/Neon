# Sweep configuration for lbm-dgx-sweep-run.sh and its plotters.
#
#   ./benchmarks/lbm_lid_driven_cavity/scripts/lbm-dgx-sweep-run.sh \
#       benchmarks/lbm_lid_driven_cavity/scripts/lbm-dgx-sweep.yml
#   python3 benchmarks/lbm_lid_driven_cavity/scripts/plotting/plot_scaling.py \
#       --config benchmarks/lbm_lid_driven_cavity/scripts/lbm-dgx-sweep.yml
#
# Every key is optional; omitted keys use the script defaults, and an env var
# of the same name in upper case (CONFIGS, SIZES, GPUS_LIST, ...) overrides
# the file. DRY_RUN=1 prints the resolved config and every run, then exits.

# Lattice:collision pairs, each swept over everything below:
#   q19:bgk  D3Q19 + BGK
#   q27:bgk  D3Q27 + BGK
#   q27:kbc  D3Q27 + KBC (KBC is only implemented for D3Q27)
# e.g. configs: [q19:bgk, q27:bgk, q27:kbc]
# Known limitation: q27:kbc with fp64 does not launch yet ("too many resources
# requested for launch": the kernel needs more registers than the library's
# 512-thread blocks allow); those runs are logged in failed-*.txt.
configs: [q19:bgk]

# Floating-point precision of the populations and the collision arithmetic:
# fp32 and/or fp64. fp64 moves twice the bytes per lattice node, so expect
# roughly half the MLUPS of fp32 and twice the memory. On a 40 GB A100 the
# 1-GPU run at N=512 does not fit in fp64 (q19 or q27; N=448 does): it fails
# out of memory, so that fp64 series has no 1-GPU reference at N=512.
# Every grid below supports both precisions.
# e.g. precisions: [fp32, fp64]
precisions: [fp32]

# Domain edge lengths N: a list, or an inclusive {start, stop, step} range.
sizes: {start: 256, stop: 512, step: 64}

# Grid families, one plot panel each (one per decomposition for the
# distributed grids):
#   dense, disg          single-process grids: z split across the GPUs of one
#                        process (intra), or one GPU per MPI rank (mpi, mpip2p)
#   dense_distributed,   one MPI rank per GPU, split by the decompositions
#   disg_distributed     below; they skip the intra transport
grids: [dense, disg]

# GPU counts of the single-process grids and of slab runs. NCCL and MPI (P2P)
# are skipped at 1 GPU (see mpi_single_gpu).
gpus: {start: 1, stop: 8, step: 1}

# Process decompositions of the distributed grids:
#   slab    split z           (GPU counts: gpus)
#   pencil  split y and z     (GPU counts: gpus_pencil)
#   brick   split x, y and z  (GPU counts: gpus_brick)
# ProcessGrid factorises the rank count, so pencil only differs from a slab at
# 4 (1x2x2) and 8 (1x2x4), and brick only at 8 (2x2x2); the plots print the
# process grid under each GPU count.
decompositions: [slab]
gpus_pencil: [4, 8]
gpus_brick: [8]

# Halo transports, one curve each:
#   intra   Peeraccess (one process, intra-process NVLink P2P)
#   mpi     NCCL       (mpiexec -n G)
#   mpip2p  MPI (P2P)  (mpiexec -n G, CARBON_DIST_TRANSPORT=mpi)
transports: [intra, mpi, mpip2p]

# true also runs NCCL and MPI (P2P) of dense / disg at 1 GPU: one rank pinned
# to GPU 0 (a plain mpiexec -n 1 would grab every visible GPU). Its MLUPS
# matches the Peeraccess 1-GPU run; set it when every transport needs a
# 1-GPU point, e.g. for plot_best_family.py.
mpi_single_gpu: false

# Halo stream priority, one curve each: off = normal priority, on = --hp-halo
# (Skeleton halo_stream_priority = High; needs overlap != none). With both,
# the plotter also writes <series>-hp-speedup-<transport>.png.
hp_halo: ["off"]

# Skeleton OCC mode of every run: none, standard, extended, twoway-extended.
overlap: standard

# 1-GPU reference of the MLUPS-per-GPU plots (the dashed "ideal" line). For
# size N the plotters read
#   <reference_dir>/<reference_prefix>-<lattice>-<collision>-<precision>-<reference_label>-n<N>-g1.json
# reference_dir is relative to the carbon repo root; empty = this sweep's own
# json/ folder, and empty reference_prefix = prefix.
reference_dir: ""
reference_prefix: ""
reference_label: dense-intra

# Figures plot_scaling.py writes for each series:
#   vs_gpus     <series>-mlups-per-gpu-vs-gpus-n<N>.png, one per size N
#   vs_n        <series>-mlups-per-gpu-vs-n-g<G>.png at the largest GPU count
#   hp_speedup  <series>-hp-speedup-<transport>.png (needs hp_halo off and on)
#   grids       <series>-grids-n<N>.png, one curve per grid on shared axes: the
#               same transport (NCCL, slab) and each grid's best configuration
plots: [vs_gpus, vs_n, hp_speedup, grids]

# Timing: warmup untimed solver steps, then reps repetitions of
# iters_per_rep solver steps, each timed separately.
warmup: 400
iters_per_rep: 1000
reps: 5

# CUDA compute capability the binaries are compiled for
# (CMAKE_CUDA_ARCHITECTURES). auto detects it from the GPUs via nvidia-smi
# (8.0 -> 80 on this A100 node, 9.0 -> 90 on H100). Set a number, or a list
# like [80, 90], to build for other GPUs. Changing it needs a rebuild, so keep
# skip_build: false for that run.
sm_arch: auto

# Docker image (built from docker/Dockerfile.cuda) that compiles both build
# trees and does the Peeraccess (intra) runs.
image_intra: carbon-cuda:local

# Docker image for the NCCL and MPI (P2P) runs; it uses the build-mpi/ binary
# compiled in image_intra. Its NCCL is pinned to match this host's driver:
# with plain carbon-cuda:local, ncclCommInitRank fails on this DGX.
image_mpi: carbon-cuda-nccl-pinned:local

# Reports go to benchmarks/lbm_lid_driven_cavity/data/<prefix>/json/ as
# <prefix>-<lattice>-<collision>-<precision>-<label>-n<N>-g<G>.json, with
# <label> = <grid>-<transport> for dense / disg (plus -hpon with hp_halo on)
# and <grid>-<decomposition>-<transport>-hp<off|on> for the distributed grids
# (e.g. lbm-dgx-sweep-q27-kbc-fp64-dense-mpi-n384-g4.json,
# lbm-dgx-sweep-q19-bgk-fp32-dense_distributed-brick-mpi-hpon-n512-g8.json).
# The plotters take this file too (--config) and write one set of PNGs per
# series into data/<prefix>/. Use a new prefix per sweep to keep results
# apart; it must be a plain name (letters, digits, . _ -), as it is also the
# folder name.
prefix: lbm-dgx-sweep

# true reuses the existing build/ and build-mpi/ trees; false (re)configures
# and builds both inside image_intra before running (incremental, so cheap
# when nothing changed). Set false after changing the benchmark or library.
skip_build: false

# false skips every run whose report already exists, so an interrupted sweep
# resumes where it stopped and extending sizes/gpus only does the new runs.
# true redoes and overwrites every run.
force: true

# Seconds before a single run is killed (guards against NCCL/MPI hangs). The
# run is logged in json/failed-{intra,mpi}.txt and the sweep continues.
# The longest default run (N=512, 1 GPU) takes ~30 s of solver steps plus setup.
run_timeout: 1800
