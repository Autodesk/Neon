# Frozen copy of the sweep configuration of this result set (8x A100-SXM4-40GB).
# Do not edit it to run new sweeps; copy scripts/lbm-dgx-sweep.yml (which
# documents every key) instead.
#
# Reproduce the runs and the plots with ./reproduce.sh (next to this file).
#
# Domain-size sweep: every family at 8 GPUs plus the 1-GPU Peeraccess runs
# (the reference). N stops at 608: N=640 does not fit the two Q=19 population
# fields on one 40 GB A100. lbm-dgx-a100-40gb-colormap.yml adds 2 and 4 GPUs
# to the same json/ folder.

configs: [q19:bgk]
precisions: [fp32]
sizes: {start: 128, stop: 608, step: 32}

grids: [dense, disg]
gpus: [1, 8]
transports: [intra, mpi, mpip2p]
overlap: standard

plots: [vs_n]

# 2000 solver steps per run, the first 400 untimed.
warmup: 400
iters_per_rep: 1600
reps: 1

sm_arch: "80"
image_intra: carbon-cuda:local
image_mpi: carbon-cuda-nccl-pinned:local
prefix: lbm-dgx-a100-40gb
skip_build: false
force: false
run_timeout: 1800
