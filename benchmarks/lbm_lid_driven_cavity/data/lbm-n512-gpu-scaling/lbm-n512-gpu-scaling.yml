# Frozen copy of the sweep configuration of this result set (8x A100-SXM4-40GB).
# Do not edit it to run new sweeps; copy scripts/lbm-dgx-sweep.yml (which
# documents every key) instead.
#
# Reproduce the runs and the plot with ./reproduce.sh (next to this file).
#
# Strong scaling at N=512 on 1, 2, 4 and 8 GPUs for Dense / DenseDisg x
# Peeraccess / NCCL / MPI (P2P). The MPI transports also run at 1 GPU (one
# rank on GPU 0), so every curve starts at the reference.

configs: [q19:bgk]
precisions: [fp32]
sizes: [512]

grids: [dense, disg]
gpus: [1, 2, 4, 8]
transports: [intra, mpi, mpip2p]
mpi_single_gpu: true
overlap: standard

plots: [vs_gpus]

# 2000 solver steps per run, the first 400 untimed.
warmup: 400
iters_per_rep: 1600
reps: 1

sm_arch: "80"
image_intra: carbon-cuda:local
image_mpi: carbon-cuda-nccl-pinned:local
prefix: lbm-n512-gpu-scaling
skip_build: false
force: true
run_timeout: 1800
