# Sweep configuration for lbm-sweep-run.sh and the plotters in plotting/.
#
#   ./benchmarks/lbm_ldc/scripts/lbm-sweep-run.sh \
#       benchmarks/lbm_ldc/scripts/lbm-sweep.yml [--only grids]
#   python3 benchmarks/lbm_ldc/scripts/plotting/plot_scaling.py \
#       --config benchmarks/lbm_ldc/scripts/lbm-sweep.yml
#
# A sweep is a list of experiments. Each has a type, which decides the figures
# the plotters draw, and its own run matrix. All experiments share the timing
# below, so a run two experiments need is executed once and both read the same
# report. DRY_RUN=1 lists every run; --only runs a subset of the experiments.
#
# Global keys: every one is optional, and an env var of the same name in upper
# case (RUNNER, FORCE, SKIP_BUILD, WARMUP, ...) overrides the file.

# docker builds and runs inside the images below; local builds with the host's
# cmake / nvcc into build_dir and build_mpi_dir and runs there (mpiexec from
# the PATH for the NCCL / MPI (P2P) runs).
runner: docker

# Timing of every run: warmup untimed solver steps, then reps repetitions of
# iters_per_rep solver steps, each timed separately (binary --reps).
warmup: 400
iters_per_rep: 1000
reps: 5

# Skeleton OCC mode of every run: none, standard, extended, twoway-extended.
overlap: standard

# 1-GPU run whose MLUPS draws the dashed "ideal" line of the MLUPS-per-GPU
# plots, read from the same series and size: <series>-<reference_label>-n<N>-g1.
# An experiment without that run (e.g. only distributed grids) has no ideal
# line unless another experiment runs it.
reference_label: dense-intra

# Output folder, relative to the carbon repo root: reports in json/, plots in
# plots/<experiment>/, progress in trace.log, failed runs in failed-*.txt.
# git ignores it; reference/ next to it is the committed copy.
data_dir: benchmarks/lbm_ldc/data

# CUDA compute capability the binaries are compiled for
# (CMAKE_CUDA_ARCHITECTURES). auto detects it via nvidia-smi (A100 -> 80,
# H100 -> 90); a number or a list like [80, 90] builds for other GPUs.
sm_arch: auto

# Docker images (runner: docker). image_intra (docker/Dockerfile.cuda) builds
# both trees and does the Peeraccess runs; image_mpi does the NCCL and MPI (P2P)
# runs with the build-mpi/ binary. Its NCCL is pinned to match this host's
# driver: with plain carbon-cuda:local, ncclCommInitRank fails on this DGX.
image_intra: carbon-cuda:local
image_mpi: carbon-cuda-nccl-pinned:local

# Build trees, relative to the repo root. build_mpi_dir is only built when an
# experiment has NCCL or MPI (P2P) runs.
build_dir: build
build_mpi_dir: build-mpi

# true reuses the build trees as they are; false (re)configures and builds
# them first (incremental, so cheap when nothing changed).
skip_build: false

# false reuses a report that already exists if its iters, warmup, reps and
# overlap match this file (an interrupted sweep resumes where it stopped,
# extending a matrix only does the new runs); a report with other settings is
# redone. true redoes every run.
force: false

# Seconds before a single run is killed (guards against NCCL / MPI hangs).
run_timeout: 1800

# Matrix keys: defaults for every experiment; each experiment can override them.
#
#   configs         lattice:collision pairs: q19:bgk (D3Q19 + BGK), q27:bgk,
#                   q27:kbc (KBC exists only for D3Q27; q27:kbc in fp64 does
#                   not launch yet: too many registers for 512-thread blocks)
#   precisions      fp32 and/or fp64 (fp64: about half the MLUPS, twice the
#                   memory; the 1-GPU N=512 run does not fit a 40 GB A100)
#   sizes           domain edge lengths N: a list or {start, stop, step}
#   gpus            GPU counts of dense / disg and of slab runs
#   grids           dense, disg (single-process: z split across one process's
#                   GPUs, or one GPU per rank under NCCL / MPI (P2P));
#                   dense_distributed, disg_distributed (one MPI rank per GPU,
#                   split by the decompositions; they skip intra)
#   decompositions  slab (z), pencil (y, z), brick (x, y, z); ProcessGrid only
#                   differs from slab for pencil at 4 / 8 and brick at 8 GPUs
#   gpus_pencil     GPU counts of pencil runs (default [4, 8])
#   gpus_brick      GPU counts of brick runs (default [8])
#   transports      intra (Peeraccess), mpi (NCCL), mpip2p (MPI (P2P),
#                   CARBON_DIST_TRANSPORT=mpi)
#   mpi_single_gpu  true also runs NCCL / MPI (P2P) of dense / disg at 1 GPU
#                   (one rank pinned to GPU 0)
#   hp_halo         off and/or on (--hp-halo: high-priority halo stream)
#   plots           subset of the figures of the experiment's type (default all;
#                   [] for an experiment that only provides runs, e.g. the
#                   1-GPU reference of the distributed grids)
configs: [q19:bgk]
precisions: [fp32]

# Experiments: name -> type + matrix. The name is the plots/ subfolder.
#
#   type            figures (plots key)        plotter
#   strong_scaling  vs_gpus                    plot_scaling.py: MLUPS/GPU vs GPU
#                                              count, one figure per size N
#                   hp_speedup                 plot_scaling.py: hp-halo on / off
#                                              (needs hp_halo off and on)
#                   grids                      plot_scaling.py: every grid on shared
#                                              axes, NCCL slab and fastest config
#                   disg_vs_dense              plot_disg_vs_dense.py: DenseDisg /
#                                              Dense ratio (+ CSV)
#   domain_size     vs_n                       plot_scaling.py: MLUPS/GPU vs N at
#                                              the largest GPU count
#   best_family     best_family                plot_best_family.py: N x G map of the
#                                              fastest of Dense / DenseDisg x
#                                              Peeraccess / NCCL (needs dense, disg,
#                                              intra, mpi; mpi_single_gpu fills G=1)
experiments:
  # All four grids with every transport, decomposition and hp-halo setting.
  grids:
    type: strong_scaling
    sizes: {start: 256, stop: 512, step: 64}
    gpus: {start: 1, stop: 8, step: 1}
    grids: [dense, disg, dense_distributed, disg_distributed]
    decompositions: [slab, pencil, brick]
    transports: [intra, mpi, mpip2p]
    hp_halo: ["off", "on"]

  # Dense / DenseDisg vs domain size at 8 GPUs, plus the 1-GPU reference.
  # N stops at 608: N=640 does not fit the two Q=19 population fields on one
  # 40 GB A100, and a size without a 1-GPU reference cannot be compared.
  domain_size:
    type: domain_size
    sizes: {start: 128, stop: 608, step: 32}
    gpus: [1, 8]
    grids: [dense, disg]

  best_family:
    type: best_family
    sizes: {start: 128, stop: 608, step: 32}
    gpus: [1, 2, 4, 8]
    grids: [dense, disg]
    transports: [intra, mpi]
    mpi_single_gpu: true

  # Every transport of Dense / DenseDisg at N=512 on 1, 2, 4 and 8 GPUs.
  n512:
    type: strong_scaling
    sizes: [512]
    gpus: [1, 2, 4, 8]
    grids: [dense, disg]
    mpi_single_gpu: true
    plots: [vs_gpus]
